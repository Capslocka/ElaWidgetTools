# 自动编译 ElaWidgetToolsExample
# 在 Windows / Linux / macOS 最新系统镜像上使用 Qt 6.10.3 构建示例程序

name: Build Example

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
    paths:
      - 'CMakeLists.txt'
      - 'ElaWidgetTools/**'
      - 'ElaWidgetToolsExample/**'
      - '.github/workflows/build-example.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布到 Release 的 tag 名（留空则只构建不发布）'
        required: false
        default: ''
      prerelease:
        description: '标记为预发布版本'
        required: false
        type: boolean
        default: false

env:
  QT_VERSION: 6.10.3
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows / MSVC 2022
            os: windows-latest
            qt_arch: win64_msvc2022_64
            qt_host: windows
          - name: Linux / GCC
            os: ubuntu-latest
            qt_arch: linux_gcc_64
            qt_host: linux
          - name: macOS / Clang
            os: macos-latest
            qt_arch: clang_64
            qt_host: mac

    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libegl1 \
            libfontconfig1 \
            libdbus-1-3 \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1

      - name: 安装 Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          host: ${{ matrix.qt_host }}
          target: desktop
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-${{ matrix.qt_arch }}
          setup-python: true

      - name: 配置 MSVC 开发环境
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 安装 Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: CMake configure
        shell: bash
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DQT_SDK_DIR="$QT_ROOT_DIR" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: CMake build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: CMake install
        run: cmake --install build --config ${{ env.BUILD_TYPE }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ElaWidgetToolsExample-${{ runner.os }}-qt${{ env.QT_VERSION }}
          path: Install/
          retention-days: 14
          if-no-files-found: error

  release:
    name: 发布到 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    permissions:
      contents: write
    steps:
      - name: 下载所有平台 artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 打包每平台为 zip
        run: |
          set -euo pipefail
          mkdir -p dist
          cd artifacts
          for d in */; do
            name="${d%/}"
            (cd "$d" && zip -r "../../dist/${name}.zip" .)
          done
          cd ..
          ls -lh dist/

      - name: 计算 release tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*.zip
